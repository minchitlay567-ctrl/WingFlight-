name: Build WingFlight ISO
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso

      - name: Configure WingFlight
        run: |
          mkdir -p config/package-lists
          mkdir -p config/hooks/live
          cat > config/package-lists/wingflight.list.chroot <<'EOF'
          xfce4
          xfce4-terminal
          lightdm
          firefox-esr
          network-manager
          network-manager-gnome
          thunar
          blueman
          synaptic
          zram-tools
          earlyoom
          sudo
          firmware-linux
          firmware-misc-nonfree
          broadcom-sta-dkms
          dkms
          build-essential
          linux-headers-amd64
          EOF

          lb config \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --debian-installer none \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootappend-live "boot=live components quiet splash intel_iommu=off"

      - name: Build ISO
        run: |
          sudo lb build

      - name: Rename ISO
        run: |
          ISO=$(find . -maxdepth 1 -name '*.iso' -print -quit)
          test -n "$ISO"
          mv "$ISO" WingFlight-A1466.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: WingFlight-A1466-ISO
          path: WingFlight-A1466.iso
          retention-days: 7
